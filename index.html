<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homes England investment decision engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.1.14/dist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
  :root { --bg: #111418; --panel: #171b21; --line: #262c35; --text: #e6e9ee; --muted: #8a93a3; --accent: #4fb477; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, system-ui, sans-serif; }
  body { display: flex; }
  aside { width: 340px; height: 100%; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
  header { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .title { display: flex; align-items: flex-start; gap: 10px; }
  .title h1 { flex: 1; }
  .title button { flex: none; width: auto; padding: 3px 8px; font-size: 12px; }
  #params-open { position: absolute; top: 12px; left: 12px; z-index: 2; width: auto; padding: 8px 14px; background: var(--panel); box-shadow: 0 4px 16px #0008; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  .legend { margin-top: 14px; }
  .legend .bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #d73027, #ffffff, #1a9850); }
  .legend .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions.config { margin-top: 12px; }
  button { flex: 1; background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .seg { display: flex; margin-top: 14px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg span { padding: 6px 10px; color: var(--muted); }
  .seg button { border: 0; border-left: 1px solid var(--line); border-radius: 0; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; }
  .kctl { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); }
  .kctl input { flex: 1; accent-color: var(--accent); }
  .kctl b { color: var(--text); font-weight: 500; width: 16px; text-align: right; font-variant-numeric: tabular-nums; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .swatches i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  [hidden] { display: none !important; }
  /* Chat with the agent: a collapsible right sidebar, open by default; collapsed, it's a high-contrast button on the map. */
  #chat-open { position: absolute; top: 12px; right: 12px; z-index: 2; width: auto; padding: 9px 16px; font-weight: 600;
    background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 16px #0008; }
  #chat-open:hover { border-color: var(--accent); filter: brightness(1.1); }
  #chat { width: 380px; height: 100%; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
  #chat .head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
  #chat .head b { flex: 1; font-size: 15px; font-weight: 600; }
  #chat .head b::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
  #chat .head button { flex: none; width: auto; padding: 3px 8px; font-size: 12px; }
  #chat-log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  #chat-log .msg { white-space: pre-wrap; line-height: 1.45; }
  #chat-log .user { align-self: flex-end; background: #262c35; padding: 6px 10px; border-radius: 8px; max-width: 85%; }
  #chat-log .step { color: var(--muted); font-size: 12px; }
  #chat-log .err { color: #ef8a80; font-size: 12px; }
  .suggest { display: flex; flex-direction: column; gap: 6px; }
  .suggest button { flex: none; text-align: left; padding: 7px 10px; }
  .activity { color: var(--muted); font-size: 12px; }
  .activity summary { display: flex; align-items: baseline; gap: 6px; cursor: pointer; list-style: none; }
  .activity summary::-webkit-details-marker { display: none; }
  .activity summary::before { content: "▸"; font-size: 10px; }
  .activity[open] summary::before { content: "▾"; }
  .activity.running .label { color: var(--text); }
  .activity .time { margin-left: auto; font-variant-numeric: tabular-nums; }
  .activity ol { margin: 6px 0 0; padding-left: 26px; line-height: 1.6; }
  .dots i { display: inline-block; width: 3px; height: 3px; margin-left: 2px; border-radius: 50%; background: var(--text); animation: blink 1.2s infinite both; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
  #chat form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  #chat textarea { flex: 1; resize: none; height: 54px; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit; }
  #chat form button { flex: none; width: auto; padding: 0 14px; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #chat form button:disabled { opacity: 0.5; cursor: default; }
  #profile, #deciles { position: absolute; right: 12px; bottom: 36px; z-index: 1; max-height: calc(100% - 60px); overflow: auto;
    background: #171b21ee; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 11px; }
  #profile h3, #deciles h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  #profile table { border-collapse: separate; border-spacing: 2px; }
  #profile th { font-weight: 500; color: var(--muted); padding: 0 4px 4px; cursor: default; white-space: nowrap; }
  #profile th i { display: block; height: 4px; border-radius: 2px; margin-bottom: 4px; }
  #profile td { padding: 3px 6px; text-align: center; font-variant-numeric: tabular-nums; border-radius: 3px; min-width: 32px; transition: opacity .15s; }
  #profile td:first-child { text-align: left; color: var(--text); background: none; padding-left: 0; white-space: nowrap; }
  #profile .dim, #deciles .dim { opacity: 0.25; }
  #deciles .dec { display: flex; align-items: center; gap: 8px; padding: 2px 4px; border-radius: 3px; cursor: default; transition: opacity .15s; }
  #deciles .dec:hover { background: #ffffff10; }
  #deciles .dec i { width: 22px; height: 12px; border-radius: 2px; }
  #deciles .dec span { flex: 1; color: var(--text); white-space: nowrap; }
  #deciles .dec b { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }
  #features { flex: 1; overflow-y: auto; padding: 4px 0 20px; }
  h2 { margin: 18px 20px 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  h2 .count { float: right; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .f { padding: 7px 20px; }
  .f .top { display: flex; align-items: center; gap: 10px; }
  .f label { flex: 1; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f .w { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 38px; text-align: right; white-space: nowrap; }
  .f.off label, .f.off .w { color: #5c6573; }
  .f input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); display: none; }
  .f:not(.off) input[type=range] { display: block; }
  .sw { appearance: none; width: 28px; height: 16px; border-radius: 8px; background: #333a45; position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #cfd5de; transition: transform .15s; }
  .sw:checked { background: var(--accent); }
  .sw:checked::after { transform: translateX(12px); background: #fff; }
  #map { position: relative; flex: 1; }
  .tip { font: 12px/1.5 Inter, system-ui, sans-serif; }
  .tip b { font-size: 14px; }
  .tip table { border-spacing: 0; margin-top: 4px; }
  .tip td { padding: 0 0 0 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .tip td:first-child { padding: 0; text-align: left; color: #aab2bf; }
</style>
</head>
<body>
<aside id="params">
  <header>
    <div class="title"><h1>Homes England investment decision engine</h1><button id="params-close" title="Hide the parameters">Hide</button></div>
    <p id="desc"></p>
    <div class="legend swatches" id="legend-cluster" hidden></div>
    <div class="actions"><button id="reset">Reset</button><button id="clear">Clear all</button><button id="basemap">Light map</button></div>
    <div class="seg" id="res"><span>Zones</span></div>
    <div class="seg" id="mode"><button data-mode="score" class="on">Scores</button><button data-mode="cluster">Cluster areas</button></div>
    <div class="kctl" id="kctl" hidden><span>Clusters</span><input type="range" id="k" min="1" max="10" value="5"><b id="kval">5</b></div>
    <div class="actions config"><button id="export">Export config</button><button id="load">Load config</button></div>
    <input type="file" id="load-file" accept=".yaml,.yml" hidden>
  </header>
  <div id="features"></div>
</aside>
<div id="map"><div id="profile" hidden></div><div id="deciles"></div>
  <button id="params-open" hidden>Parameters</button>
  <button id="chat-open" hidden>Ask the agent</button>
</div>
<section id="chat" hidden>
  <div class="head"><b>Ask the agent</b><button id="chat-new" title="Start a new conversation">New chat</button><button id="chat-close" title="Hide the agent">Hide</button></div>
  <div id="chat-log"></div>
  <form id="chat-form"><textarea id="chat-input" placeholder="What do you want to see?"></textarea><button>Send</button></form>
</section>

<script>
const state = {};          // key -> {on, w}
const excl = {};          // hard exclusion layer key -> {on, t}: excluded if coverage >= t
let exclusions, excludedCount = 0;
let features, cells, raw, cov, vals, profile, highlight = null, level, baseLevel, mode = 'score', version = 0;   // vals: percentile or cluster id per zone
const DESC = {
  score: 'Score = Σ weight × feature percentile, shown as percentile among non-excluded zones.',
  cluster: 'K-means on the percentiles of the features switched on (weights ignored).',
};

const RED = [215, 48, 39], WHITE = [255, 255, 255], GREEN = [26, 152, 80];
/**
 * Linear interpolation between two RGB colours.
 * @param {number[]} a - Start colour [r, g, b].
 * @param {number[]} b - End colour [r, g, b].
 * @param {number} t - Position between them, 0 (a) to 1 (b).
 * @returns {number[]} Interpolated [r, g, b], rounded to integers.
 */
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
/**
 * Diverging red-white-green colour for a score percentile.
 * @param {number} p - Percentile in [0, 1]: 0 is red, 0.5 white, 1 green.
 * @returns {number[]} [r, g, b].
 */
const scoreColor = p => p < 0.5 ? mix(RED, WHITE, p * 2) : mix(WHITE, GREEN, (p - 0.5) * 2);
const TAB10 = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf']
  .map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const EXCLUDED = [110, 116, 128, 70];
/**
 * Decile a score percentile falls in.
 * @param {number} p - Percentile in [0, 1].
 * @returns {number} Decile index 0-9 (a percentile of 1 counts as decile 9).
 */
const decile = p => Math.min(9, Math.floor(p * 10));
/**
 * Fill colour of a zone on the map.
 * highlight = hovered cluster (cluster mode) or decile (score mode); everything else fades.
 * @param {?number} v - The zone's value: cluster id (cluster mode), score percentile (score mode) or null if excluded.
 * @returns {number[]} [r, g, b, a]: grey for excluded zones, a categorical colour per cluster or the score colour,
 *   faded when another cluster or decile is highlighted.
 */
const color = v => {
  if (v === null) return highlight === null ? EXCLUDED : [...EXCLUDED.slice(0, 3), 15];
  const group = mode === 'cluster' ? v : decile(v);
  return [...(mode === 'cluster' ? TAB10[v % 10] : scoreColor(v)), highlight === null || highlight === group ? 255 : 25];
};

const map = new deck.DeckGL({
  container: 'map',
  mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  initialViewState: { longitude: -0.11, latitude: 51.5, zoom: 9.7 },
  controller: true,
  getTooltip: ({ object: d }) => d && {
    className: 'tip',
    style: { background: '#0c0f13ee', border: '1px solid #262c35', borderRadius: '6px', padding: '10px 12px' },
    html: `<b>${vals[d.i] === null ? 'Excluded' : mode === 'cluster' ? `Cluster ${vals[d.i] + 1}` : `${Math.round(vals[d.i] * 100)}th percentile`}</b><br><span style="color:#8a93a3">${d.id}</span><table>` +
      exclusions.filter(x => cov[x.key][d.i] > 0).map(x =>
        `<tr><td>${x.label} <i style="color:#5c6573">coverage</i></td><td>${Math.round(cov[x.key][d.i] * 100)}%</td></tr>`).join('') +
      features.filter(f => state[f.key].on).map(f =>
        `<tr><td>${f.label}${level !== baseLevel ? ` <i style="color:#5c6573">${f.agg}</i>` : ''}</td><td>${raw[d.i][f.col].toLocaleString()}</td></tr>`).join('') + '</table>'
  },
});

/**
 * Redraw the map and everything derived from the current values: the cluster legend, the cluster profile
 * table, the decile scale and the excluded-zone count.
 */
function render() {
  map.setProps({ layers: [new deck.PolygonLayer({
    id: 'cells', data: cells,
    getPolygon: d => d.poly,
    getFillColor: d => color(vals[d.i]),
    getLineColor: [0, 0, 0, 60], lineWidthMinPixels: 0.5,
    opacity: 0.5, pickable: true, autoHighlight: true, highlightColor: [255, 255, 255, 90],
    updateTriggers: { getFillColor: [version, highlight] },
    transitions: { getFillColor: 250 },
  })] });
  if (mode === 'cluster') {
    const counts = vals.reduce((c, v) => (v !== null && (c[v] = (c[v] || 0) + 1), c), []);
    document.getElementById('legend-cluster').innerHTML = counts.map((n, c) =>
      `<span><i style="background:rgb(${TAB10[c % 10]})"></i>${c + 1} · ${n}</span>`).join('');
  }
  renderProfile();
  renderDeciles();
  const n = document.getElementById('excl-count');
  if (n) n.textContent = `${excludedCount.toLocaleString()} of ${vals.length.toLocaleString()} excluded`;
}

/**
 * Draw the cluster profile table (cluster mode only, hidden otherwise).
 * Rows = switched-on features, columns = clusters, cell = centre percentile (50 = London median).
 */
function renderProfile() {
  const el = document.getElementById('profile');
  el.hidden = mode !== 'cluster' || !profile || !profile.keys.length;
  if (el.hidden) return;
  const counts = vals.reduce((c, v) => (v !== null && (c[v] = (c[v] || 0) + 1), c), []);
  const rows = features.filter(f => profile.keys.includes(f.key));
  const dim = c => highlight !== null && highlight !== c ? ' class="dim"' : '';
  el.innerHTML = `<h3>Cluster profiles · centre percentile</h3><table><tr><th></th>` +
    profile.centers.map((_, c) => `<th data-c="${c}"${dim(c)}><i style="background:rgb(${TAB10[c % 10]})"></i>${c + 1} (${counts[c] || 0})</th>`).join('') + '</tr>' +
    rows.map(f => { const j = profile.keys.indexOf(f.key); return `<tr><td>${f.label}</td>` + profile.centers.map((ctr, c) => {
      const v = ctr[j];
      return `<td data-c="${c}"${dim(c)} style="background:rgb(${scoreColor(v / 100)});color:${Math.abs(v - 50) > 30 ? '#fff' : '#111'}">${Math.round(v)}</td>`;
    }).join('') + '</tr>'; }).join('') + '</table>';
}
/**
 * Draw the decile scale (score mode only, hidden otherwise).
 * One row per decile, top = best, with the number of zones in each.
 */
function renderDeciles() {
  const el = document.getElementById('deciles');
  el.hidden = mode !== 'score';
  if (el.hidden) return;
  const counts = Array(10).fill(0);
  vals.forEach(v => v !== null && counts[decile(v)]++);
  const dim = d => highlight !== null && highlight !== d ? ' dim' : '';
  el.innerHTML = '<h3>Score percentile</h3>' + [9, 8, 7, 6, 5, 4, 3, 2, 1, 0].map(d =>
    `<div class="dec${dim(d)}" data-c="${d}"><i style="background:rgb(${scoreColor((d + 0.5) / 10)})"></i>` +
    `<span>${d * 10}th–${d === 9 ? 100 : d * 10 + 9}th</span><b>${counts[d].toLocaleString()}</b></div>`).join('');
}

// Hovering a cluster column or a decile row fades the other zones on the map.
['profile', 'deciles'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('mouseover', e => { const c = e.target.closest('[data-c]'); setHighlight(c ? +c.dataset.c : null); });
  el.addEventListener('mouseleave', () => setHighlight(null));
});
/**
 * Highlight one cluster or decile on the map, fading the others. Re-renders only if it changed.
 * @param {?number} c - Cluster id (cluster mode) or decile 0-9 (score mode), or null to clear the highlight.
 */
function setHighlight(c) { if (c !== highlight) { highlight = c; render(); } }

// Latest-wins request coalescing: never more than one request in flight.
let inflight = false, queued = false;
/**
 * Ask the backend for the zone values under the current sidebar settings.
 * Sends the switched-on feature weights, enabled exclusion thresholds and number of clusters.
 * @param {string} level - Zone level key.
 * @param {string} mode - 'score' or 'cluster'.
 * @returns {Promise<Object>} The /score response ({pct, excluded}) or the /cluster response ({labels, keys, centers, excluded}).
 */
async function fetchValues(level, mode) {
  const weights = Object.fromEntries(Object.entries(state).filter(([, s]) => s.on).map(([k, s]) => [k, s.w]));
  const n_clusters = +document.getElementById('k').value;
  const r = await fetch(mode === 'cluster' ? '/cluster' : '/score', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      weights, level, n_clusters, exclusions: Object.fromEntries(Object.entries(excl).filter(([, x]) => x.on).map(([k, x]) => [k, x.t])),
    }),
  });
  return r.json();
}
/**
 * Store a backend response as the current zone values, and bump the version so the map recolours.
 * @param {string} m - Mode the response was computed for: 'score' or 'cluster'.
 * @param {Object} j - Response from fetchValues().
 */
function apply(m, j) { vals = m === 'cluster' ? j.labels : j.pct; profile = m === 'cluster' ? j : null; excludedCount = j.excluded; version++; }
/**
 * Recompute the zone values after a sidebar change and redraw.
 * Calls made while a request is in flight are coalesced into one follow-up request. A response is dropped
 * if the level or mode changed while it was in flight.
 * @returns {Promise<void>}
 */
async function update() {
  if (inflight) { queued = true; return; }
  inflight = true;
  const [l, m] = [level, mode], j = await fetchValues(l, m);
  if (l === level && m === mode) { apply(m, j); render(); }
  inflight = false;
  if (queued) { queued = false; update(); }
}

/**
 * Rebuild the parameters sidebar from the current state: a switch and threshold slider per hard exclusion,
 * then a switch and weight slider per feature, under their group headings. Each control updates the state
 * and calls update().
 */
function buildSidebar() {
  const el = document.getElementById('features'); el.innerHTML = '';
  el.insertAdjacentHTML('beforeend', `<h2>Hard exclusions<span class="count" id="excl-count"></span></h2>`);
  // Each layer: switch + slider for the coverage share at or above which a zone is excluded.
  exclusions.forEach(x => {
    const e = excl[x.key], row = document.createElement('div');
    row.className = 'f' + (e.on ? '' : ' off');
    row.innerHTML = `<div class="top"><input type="checkbox" class="sw" id="x-${x.key}" ${e.on ? 'checked' : ''}>
      <label for="x-${x.key}">${x.label}</label><span class="w" title="Exclude if covered ≥">≥ ${Math.round(e.t * 100)}%</span></div>
      <input type="range" min="0.05" max="1" step="0.05" value="${e.t}">`;
    const [tog, tEl, slider] = [row.querySelector('.sw'), row.querySelector('.w'), row.querySelector('input[type=range]')];
    tog.onchange = () => { e.on = tog.checked; row.classList.toggle('off', !e.on); update(); };
    slider.oninput = () => { e.t = +slider.value; tEl.textContent = `≥ ${Math.round(e.t * 100)}%`; update(); };
    el.appendChild(row);
  });
  let g;
  features.forEach(f => {
    if (f.group !== g) { g = f.group; el.insertAdjacentHTML('beforeend', `<h2>${g}</h2>`); }
    const s = state[f.key], row = document.createElement('div');
    row.className = 'f' + (s.on ? '' : ' off');
    row.innerHTML = `<div class="top"><input type="checkbox" class="sw" id="t-${f.key}" ${s.on ? 'checked' : ''}>
      <label for="t-${f.key}" title="${f.key}">${f.label}</label><span class="w">${s.w.toFixed(2)}</span></div>
      <input type="range" min="-1" max="1" step="0.05" value="${s.w}">`;
    const [tog, wEl, slider] = [row.querySelector('.sw'), row.querySelector('.w'), row.querySelector('input[type=range]')];
    tog.onchange = () => { s.on = tog.checked; row.classList.toggle('off', !s.on); update(); };
    slider.oninput = () => { s.w = +slider.value; wEl.textContent = s.w.toFixed(2); if (mode === 'score') update(); };
    el.appendChild(row);
  });
}

/**
 * Reset every feature and exclusion, then rebuild the sidebar and recompute.
 * @param {boolean} clear - If true, switch everything off (weights 0.5). If false, restore the default weights
 *   from /meta and enable every exclusion at 100% coverage.
 */
function setDefaults(clear) {
  features.forEach(f => state[f.key] = { on: !clear && f.default != null, w: clear ? 0.5 : (f.default ?? 0.5) });
  exclusions.forEach(x => excl[x.key] = { on: !clear, t: 1 });
  buildSidebar(); update();
}

document.getElementById('reset').onclick = () => setDefaults(false);
document.getElementById('clear').onclick = () => setDefaults(true);

/**
 * Every sidebar parameter as YAML (labels are double-quoted, which is valid YAML).
 * This is the export format, also sent to the chat agent as the user's current config.
 * @returns {string} YAML with zones, mode, n_clusters, hard_exclusions and features.
 */
function configYaml() {
  const q = JSON.stringify;
  return [
    `# Homes England investment decision engine: config exported ${new Date().toISOString()}`,
    `zones: ${level}`,
    `mode: ${mode}`,
    `n_clusters: ${document.getElementById('k').value}`,
    'hard_exclusions:  # zone excluded if layer coverage >= threshold',
    ...exclusions.flatMap(x => [`  ${x.key}:`, `    label: ${q(x.label)}`, `    enabled: ${excl[x.key].on}`, `    threshold: ${excl[x.key].t}`]),
    'features:  # weights in [-1, 1]',
    ...features.flatMap(f => [`  ${f.key}:`, `    label: ${q(f.label)}`, `    enabled: ${state[f.key].on}`, `    weight: ${state[f.key].w}`]),
  ].join('\n') + '\n';
}
document.getElementById('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([configYaml()], { type: 'application/yaml' }));
  a.download = `decision-engine-config-${new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '')}.yaml`;
  a.click();
  URL.revokeObjectURL(a.href);
};

// Load a config exported above: anything the file doesn't mention is switched off.
/**
 * Coerce a value to a number within a range.
 * @param {*} v - Value to coerce.
 * @param {number} lo - Minimum.
 * @param {number} hi - Maximum.
 * @param {number} dflt - Returned when v isn't a finite number.
 * @returns {number} v clamped to [lo, hi], or dflt.
 */
const clamp = (v, lo, hi, dflt) => Number.isFinite(+v) ? Math.min(hi, Math.max(lo, +v)) : dflt;
document.getElementById('load').onclick = () => document.getElementById('load-file').click();
document.getElementById('load-file').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';   // allow re-loading the same file
  if (!file) return;
  let cfg;
  try { cfg = jsyaml.load(await file.text()) || {}; } catch (err) { alert(`Could not read ${file.name}:\n${err.message}`); return; }
  applyConfig(cfg);
};
/**
 * Load a config (from a file or from the chat agent) into the sidebar and the map.
 * Anything the config doesn't mention is switched off, and out-of-range numbers are clamped.
 * @param {Object} cfg - Parsed config in the export format (see configYaml()).
 * @returns {Promise<void>} Resolves once the level and mode are switched and the values are recomputed.
 */
async function applyConfig(cfg) {
  features.forEach(f => {
    const c = cfg.features?.[f.key];
    state[f.key] = { on: !!c?.enabled, w: clamp(c?.weight, -1, 1, 0.5) };
  });
  exclusions.forEach(x => {
    const c = cfg.hard_exclusions?.[x.key];
    excl[x.key] = { on: !!c?.enabled, t: clamp(c?.threshold, 0.05, 1, 1) };
  });
  const k = clamp(cfg.n_clusters, 1, 10, 5);
  document.getElementById('k').value = k; document.getElementById('kval').textContent = k;
  buildSidebar();
  if (cfg.zones && cfg.zones !== level && document.querySelector(`#res button[data-level="${cfg.zones}"]`)) await setLevel(cfg.zones);
  if ((cfg.mode === 'score' || cfg.mode === 'cluster') && cfg.mode !== mode) await setMode(cfg.mode);
  update();
}

// Chat with the agent (agent.py): it investigates the data, then pushes a config that is loaded via applyConfig().
let chatSession = null;
const chatLog = document.getElementById('chat-log');
const STEPS = {   // tool -> [shown while it runs, listed once done, in the one-line summary]
  file_search: ['Searching the programme documents', 'Searched the programme documents', 'searched the documents'],
  list_documents: ['Checking the programme documents', 'Checked the programme documents', 'listed the documents'],
  describe_data: ['Looking at the data', 'Looked at the data', 'looked at the data'],
  preview_config: ['Testing a configuration', 'Tested a configuration', 'tested a configuration'],
  apply_config: ['Loading it into the map', 'Loaded it into the map', 'updated the map'],
};
const SUGGESTIONS = ['Family homes near schools and green space, away from flood risk',
  'Best MSOA candidates for the BIL Fund', 'Group boroughs into 4 clusters by amenities'];
/**
 * Append a message to the chat log and scroll to it.
 * @param {string} cls - Message kind: '' (agent; **bold** is rendered), 'user', 'step' or 'err'.
 * @param {string} text - Message text, inserted as plain text.
 * @returns {HTMLDivElement} The new message element.
 */
function chatLine(cls, text) {
  const el = document.createElement('div');
  el.className = `msg ${cls}`; el.textContent = text;
  if (!cls) el.innerHTML = el.innerHTML.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');   // agent text: render **bold** (escaped first)
  chatLog.appendChild(el); chatLog.scrollTop = chatLog.scrollHeight;
  return el;
}
/**
 * Show the chat's opening hint and the suggested prompts; clicking a suggestion sends it.
 */
function chatIntro() {
  chatLine('step', 'Describe what you want to see. The agent investigates the data, picks parameters and loads them into the map.');
  const box = document.createElement('div');
  box.className = 'suggest';
  for (const text of SUGGESTIONS) {
    const b = document.createElement('button');
    b.textContent = text;
    b.onclick = () => { document.getElementById('chat-input').value = text; document.getElementById('chat-form').requestSubmit(); };
    box.appendChild(b);
  }
  chatLog.appendChild(box);
}
/**
 * Add the activity line for one agent turn to the chat log.
 * One line per agent turn: the current step with a timer while it runs, then a summary of the steps (expandable).
 * @returns {{tool: function(string): void, note: function(string): void, finish: function(boolean): void}}
 *   tool(name) records a tool call; note(text) adds a line to the expandable list; finish(failed) stops the
 *   timer and shows the summary, or 'Stopped' if failed. finish() removes the line if no tool was used, and
 *   does nothing if called again.
 */
function activity() {
  const el = document.createElement('details');
  el.className = 'activity running';
  el.innerHTML = '<summary><span class="label">Thinking</span><span class="dots"><i></i><i></i><i></i></span><span class="time">0s</span></summary><ol></ol>';
  chatLog.appendChild(el); chatLog.scrollTop = chatLog.scrollHeight;
  const $ = sel => el.querySelector(sel), start = Date.now(), tools = [];
  let finished = false;
  const elapsed = () => `${Math.round((Date.now() - start) / 1000)}s`;
  const timer = setInterval(() => { $('.time').textContent = elapsed(); }, 1000);
  const item = text => { const li = document.createElement('li'); li.textContent = text; $('ol').appendChild(li); };
  return {
    tool(name) { tools.push(name); $('.label').textContent = STEPS[name]?.[0] || name; item(STEPS[name]?.[1] || `Used ${name}`); },
    note: item,
    finish(failed) {
      if (finished) return;
      finished = true; clearInterval(timer);
      if (!tools.length && !failed) return el.remove();   // answered without tools: nothing to summarise
      el.classList.remove('running'); $('.dots').remove();
      $('.label').textContent = failed ? 'Stopped' : summarise(tools);
      $('.time').textContent = elapsed();
    },
  };
}
/**
 * One-sentence summary of the tools an agent turn used, in order of first use.
 * @example summarise(['describe_data', 'preview_config', 'preview_config', 'apply_config'])
 *   // -> "Looked at the data, tested 2 configurations and updated the map"
 * @param {string[]} tools - Tool names in call order; must not be empty.
 * @returns {string} The summary, capitalised, without a final full stop.
 */
function summarise(tools) {
  const counts = new Map();
  for (const t of tools) counts.set(t, (counts.get(t) || 0) + 1);
  const parts = [...counts].map(([t, n]) =>
    t === 'preview_config' && n > 1 ? `tested ${n} configurations` : STEPS[t]?.[2] || `used ${t}`);
  const text = parts.length > 1 ? `${parts.slice(0, -1).join(', ')} and ${parts.at(-1)}` : parts[0];
  return text[0].toUpperCase() + text.slice(1);
}
/**
 * Open or collapse a sidebar, and remember the choice in localStorage.
 * Both sidebars (#params, #chat) collapse to a button on the map (#<id>-open); each one's state is remembered.
 * @param {string} id - Sidebar element id: 'params' or 'chat'.
 * @param {boolean} open - True to show the sidebar, false to collapse it to its button.
 */
function showPanel(id, open) {
  document.getElementById(id).hidden = !open; document.getElementById(`${id}-open`).hidden = open;
  try { localStorage.setItem(`${id}-open`, open ? '1' : '0'); } catch {}
  window.dispatchEvent(new Event('resize'));   // the map's width changed
}
for (const id of ['params', 'chat']) {
  document.getElementById(`${id}-open`).onclick = () => showPanel(id, true);
  document.getElementById(`${id}-close`).onclick = () => showPanel(id, false);
  let stored = null;
  try { stored = localStorage.getItem(`${id}-open`); } catch {}
  showPanel(id, stored !== '0');
}
document.getElementById('chat-open').addEventListener('click', () => document.getElementById('chat-input').focus());
document.getElementById('chat-new').onclick = () => { chatSession = null; chatLog.innerHTML = ''; chatIntro(); };
chatIntro();
document.getElementById('chat-input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('chat-form').requestSubmit(); } };
document.getElementById('chat-form').onsubmit = async e => {
  e.preventDefault();
  const input = document.getElementById('chat-input'), send = e.target.querySelector('button');
  const message = input.value.trim();
  if (!message || send.disabled) return;
  input.value = ''; send.disabled = true;
  chatLog.querySelector('.suggest')?.remove();
  chatLine('user', message);
  const act = activity();
  try {
    const res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, config_yaml: configYaml(), session_id: chatSession }) });
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines.filter(Boolean)) {
        const ev = JSON.parse(line);
        if (ev.type === 'text') chatLine('', ev.text);
        else if (ev.type === 'tool') act.tool(ev.name);
        else if (ev.type === 'config') { await applyConfig(ev.config); act.note(`Saved as configs/${ev.file}`); }
        else if (ev.type === 'done') { chatSession = ev.session_id; act.finish(ev.error); if (ev.error) chatLine('err', 'The agent stopped with an error.'); }
        else if (ev.type === 'error') { act.finish(true); chatLine('err', ev.text); }
      }
    }
  } catch (err) { act.finish(true); chatLine('err', String(err)); }
  act.finish(false);   // no-op if already finished
  send.disabled = false; input.focus();
};

const BASEMAPS = { dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json' };
let basemap = 'dark';
document.getElementById('basemap').onclick = e => {
  basemap = basemap === 'dark' ? 'light' : 'dark';
  e.target.textContent = basemap === 'dark' ? 'Light map' : 'Dark map';
  map.setProps({ mapStyle: BASEMAPS[basemap] });
};

// Swap cells, raw values and scores in one go so the map never shows a mismatched frame.
// A zone can have several polygons (e.g. boroughs split by the Thames); each points back to its zone index i.
/**
 * One map polygon per zone part.
 * @param {Array<{id: string, polys: number[][][]}>} zones - Zones from /meta.
 * @returns {Array<{id: string, poly: number[][], i: number}>} Polygons, each with its zone id and zone index i.
 */
const flatten = zones => zones.flatMap((z, i) => z.polys.map(poly => ({ id: z.id, poly, i })));
/**
 * Switch the map to another zone level, loading its geometry and values in parallel before swapping them in.
 * @param {string} l - Zone level key, e.g. 'h3_8' or 'boroughs'.
 * @returns {Promise<void>}
 */
async function setLevel(l) {
  const [m, j] = await Promise.all([fetch(`/meta?level=${l}`).then(r => r.json()), fetchValues(l, mode)]);
  level = l; raw = m.raw; cov = m.cov; cells = flatten(m.cells); apply(mode, j);
  document.querySelectorAll('#res button').forEach(b => b.classList.toggle('on', b.dataset.level === l));
  render();
}

/**
 * Switch between score and cluster mode: fetch the new values, then update the toolbar, legend and description.
 * Clears any highlight.
 * @param {string} m - 'score' or 'cluster'.
 * @returns {Promise<void>}
 */
async function setMode(m) {
  const j = await fetchValues(level, m);
  mode = m; highlight = null; apply(m, j);
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  document.getElementById('legend-cluster').hidden = document.getElementById('kctl').hidden = m !== 'cluster';
  document.getElementById('desc').textContent = DESC[m];
  render();
}
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.getElementById('k').oninput = e => { document.getElementById('kval').textContent = e.target.value; update(); };
document.getElementById('desc').textContent = DESC.score;

fetch('/meta').then(r => r.json()).then(m => {
  baseLevel = level = m.levels[0].key;
  exclusions = m.exclusions;
  m.levels.forEach(({ key, label }) => {
    const b = document.createElement('button'); b.dataset.level = key; b.textContent = label;
    b.className = key === level ? 'on' : ''; b.onclick = () => setLevel(key);
    document.getElementById('res').appendChild(b);
  });
  const groups = ['Core', 'Policy', 'Amenities (POI count)'];
  features = m.features.map((f, col) => ({ ...f, col })).sort((a, b) => groups.indexOf(a.group) - groups.indexOf(b.group) || a.col - b.col);
  raw = m.raw; cov = m.cov; cells = flatten(m.cells);
  vals = m.raw.map(() => 0.5);
  setDefaults(false);
});
</script>
</body>
</html>
